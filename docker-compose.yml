# Audit Explorer — Coolify / docker compose deployment
# 1. Copy .env.example to .env and set SESSION_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, POSTGRES_PASSWORD.
# 2. docker compose up -d --build   (Coolify: "Docker Compose" resource pointing at this repo)
# 3. Put your reverse proxy / Coolify domain in front of port 8080 (HTTPS required for the session cookie).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://audit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/audit_explorer
      DATA_DIR: /data
      WEB_DIST: /app/web
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      IMPORT_PARALLELISM: ${IMPORT_PARALLELISM:-1}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - evidence:/data
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_explorer
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=256MB", "-c", "max_wal_size=2GB", "-c", "timezone=UTC"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_explorer"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  evidence:
  pgdata:
